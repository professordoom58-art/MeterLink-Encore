name: Ship MeterLink APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Forge MeterLink v1.0.${{ github.run_number }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Spin Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Prime Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Unit Tests & Compile MeterLink APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Stamp MeterLink APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "MeterLink-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeterLink-v1.0.${{ github.run_number }}-APK
          path: MeterLink-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MeterLink v1.0.${{ github.run_number }} APK"
          body: |
            ### MeterLink v1.0.${{ github.run_number }} APK is live!
            Commit `${{ github.sha }}`.

            **How to use:**
            Grab the APK under Assets below.
          files: "MeterLink-v1.0.${{ github.run_number }}.apk"

      - name: Keep only the latest 10 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' |
          while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done