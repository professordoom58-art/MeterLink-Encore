name: ⚡ Ship MeterLink APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Forge MeterLink v1.0.${{ github.run_number }} APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: ☕ Spin Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Prime Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 🔨 Compile MeterLink v1.0.${{ github.run_number }} APK
        run: gradle assembleDebug

      - name: 🏷️ Stamp MeterLink v1.0.${{ github.run_number }} APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeterLink-v1.0.${{ github.run_number }}.apk

      - name: 📦 Stash Artifact in Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: MeterLink-v1.0.${{ github.run_number }}-APK
          path: MeterLink-v1.0.${{ github.run_number }}.apk

      - name: 🚀 Drop MeterLink v1.0.${{ github.run_number }} APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "⚡ MeterLink v1.0.${{ github.run_number }} APK"
          body: |
            ### ⚡ MeterLink v1.0.${{ github.run_number }} APK is live!
            Fresh off the LOQ from commit `${{ github.sha }}`.

            **How to roll:**
            1. Grab **`MeterLink-v1.0.${{ github.run_number }}.apk`** under **Assets** below.
            2. Slap an optical probe onto your Android via USB OTG.
            3. Read Indian DLMS meters like you know what you're doing.
          files: MeterLink-v1.0.${{ github.run_number }}.apk