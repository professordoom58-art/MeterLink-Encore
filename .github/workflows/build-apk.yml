name: Build & Publish MeterLink APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK for Friends
        run: cp app/build/outputs/apk/debug/app-debug.apk MeterLink-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload APK to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: MeterLink-Debug-APK
          path: MeterLink-v1.0.${{ github.run_number }}-debug.apk

      - name: Publish to GitHub Releases (Direct Download for Phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MeterLink Build #${{ github.run_number }}"
          body: "Automated build from commit ${{ github.sha }}. Download and install the APK below on an Android phone with USB OTG support."
          files: MeterLink-v1.0.${{ github.run_number }}-debug.apk