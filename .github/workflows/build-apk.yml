
name: Ship MeterLink APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Forge MeterLink v1.0.${{ github.run_number }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Spin Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Prime Gradle (wrapper version)
        uses: gradle/actions/setup-gradle@v4

      - name: Test and Compile MeterLink APK
        env:
          # Drives versionCode = 100 + run number, giving every build a
          # strictly higher code while the committed keystore keeps the
          # signature stable for in-place upgrades.
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Stamp MeterLink APK
        run: cp app/build/outputs/apk/release/app-release.apk "MeterLink-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeterLink-v1.0.${{ github.run_number }}-APK
          path: MeterLink-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MeterLink v1.0.${{ github.run_number }} APK"
          body: |
            ### MeterLink v1.0.${{ github.run_number }} is ready

            **Download the MeterLink app below.**

            1. Open the app file under **Assets**.
            2. Allow installation if Android asks.
            3. Connect your optical cable and tap **Scan USB**.

            MeterLink keeps your readings on your phone and works without the internet.
          files: "MeterLink-v1.0.${{ github.run_number }}.apk"


